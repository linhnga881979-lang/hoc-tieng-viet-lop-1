<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<title>Học Tiếng Việt lớp 1 cùng bạn máy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap">
<style>
/* Học sinh lớp 1 tự học: chọn bài, đọc âm, vần, tiếng, từ; luyện thám tử chữ nhanh; đọc truyện theo 3 mức. Cùng họ màu và nhân vật với "Đọc cùng bạn máy". */
:root{
  --bg:#F3F5FB; --surface:#FFFFFF; --paper:#F8FAFF; --ink:#1B2F55; --ink2:#4B5D7E; --ink3:#6C7B99; --line:#D3DCEC;
  --blue:#2F6FD6; --bluewash:#E3EDFD; --violet:#6F55CF; --violetwash:#ECE7FB;
  --sun:#F4B41A; --sunwash:#FFF2CC; --green:#23935A; --greenwash:#DFF4E8; --red:#C8402B; --redwash:#FCE4DF;
  --display:"Baloo 2","Be Vietnam Pro",system-ui,sans-serif;
  --body:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1731; --surface:#16233F; --paper:#1B2B4C; --ink:#E9EFFC; --ink2:#B2BFDA; --ink3:#8E9CBB; --line:#2D3E64;
  --blue:#7BA6F4; --bluewash:#1F3560; --violet:#AE9BF3; --violetwash:#2B2650;
  --sun:#F4B41A; --sunwash:#3B3217; --green:#54C58A; --greenwash:#173A2D; --red:#F28A77; --redwash:#40211C; color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0E1731; --surface:#16233F; --paper:#1B2B4C; --ink:#E9EFFC; --ink2:#B2BFDA; --ink3:#8E9CBB; --line:#2D3E64;
  --blue:#7BA6F4; --bluewash:#1F3560; --violet:#AE9BF3; --violetwash:#2B2650;
  --sun:#F4B41A; --sunwash:#3B3217; --green:#54C58A; --greenwash:#173A2D; --red:#F28A77; --redwash:#40211C; color-scheme:dark; }
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,select,input{font-family:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation}
button:focus-visible,select:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.wrap{max-width:900px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 56px}
header.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
header.top h1{font-family:var(--display);font-weight:800;font-size:clamp(19px,4.6vw,30px);line-height:1.1;margin:0;flex:1;min-width:0;text-wrap:balance}
.stars{display:inline-flex;align-items:center;gap:6px;background:var(--sunwash);border:2px solid var(--sun);border-radius:999px;padding:4px 14px;font-family:var(--display);font-weight:800;font-size:20px;white-space:nowrap}
.homebtn{border:2px solid var(--line);background:var(--surface);border-radius:999px;width:48px;height:48px;font-size:22px;line-height:1;padding:0}
.homebtn[hidden]{display:none}
.card{background:var(--surface);border:2px solid var(--line);border-radius:20px;padding:clamp(14px,3vw,24px)}
.stack{display:flex;flex-direction:column;gap:14px}

/* bạn máy và lời nói */
.talk{display:flex;gap:12px;align-items:center}
.talk .may{flex:none}
.bubble{position:relative;flex:1;min-width:0;background:var(--sunwash);border:2px solid var(--sun);border-radius:18px;padding:12px 16px;font-family:var(--display);font-weight:600;font-size:clamp(19px,3.6vw,24px);line-height:1.35}
.listen{flex:none;width:56px;height:56px;border-radius:50%;border:2px solid var(--blue);background:var(--surface);color:var(--blue);display:flex;align-items:center;justify-content:center}
.listen svg,.say svg{width:26px;height:26px}
body[data-talk="1"] .mouth{transform-origin:60px 62px;animation:talk .3s ease-in-out infinite alternate}
body[data-talk="1"] .ant{transform-origin:60px 22px;animation:bob .6s ease-in-out infinite alternate}
@keyframes talk{from{transform:scaleY(.35)}to{transform:scaleY(1.6)}}
@keyframes bob{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}

/* trang chủ */
.avatars{display:flex;flex-wrap:wrap;gap:8px}
.avatars button{width:56px;height:56px;border-radius:16px;border:2.5px solid var(--line);background:var(--paper);font-size:30px;line-height:1}
.avatars button[aria-pressed="true"]{border-color:var(--violet);background:var(--violetwash)}
.field{display:flex;flex-direction:column;gap:6px;font-weight:700;color:var(--ink2);font-size:15px}
.field input{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;font-size:20px;width:100%;max-width:340px}
h2.sec{font-family:var(--display);font-size:24px;margin:6px 0 2px}
.stories{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr));gap:14px}
.story-card{display:flex;flex-direction:column;gap:6px;align-items:flex-start;text-align:left;background:var(--surface);border:2.5px solid var(--line);border-radius:20px;padding:16px;min-height:150px}
.story-card:hover{border-color:var(--violet)}
.story-card .em{font-size:46px;line-height:1}
.story-card b{font-family:var(--display);font-size:24px;line-height:1.1}
.story-card .meta{color:var(--ink2);font-size:15px}
.story-card .best{margin-top:auto;font-weight:700;color:var(--sun);filter:saturate(1.2);font-size:18px;letter-spacing:.1em}
.story-card .best i{font-style:normal;color:var(--ink3);font-size:14px;letter-spacing:0;margin-left:6px}
details.card summary{cursor:pointer;font-family:var(--display);font-weight:700;font-size:20px}
.btn{border:2px solid var(--line);background:var(--surface);border-radius:14px;padding:10px 16px;font-weight:700;font-size:16px;min-height:48px}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.small{font-size:14px;color:var(--ink2)}
.note{background:var(--sunwash);border:2px solid var(--sun);border-radius:14px;padding:10px 14px;font-size:15px}
.note.bad{background:var(--redwash);border-color:var(--red)}
.frow{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:10px}
.frow label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:700;color:var(--ink2)}
.frow select{border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:9px 10px;font-size:16px}
.linkbtn{background:none;border:none;color:var(--blue);font-weight:700;text-decoration:underline;padding:0;font-size:inherit}

/* các trạm */
.steps{display:flex;gap:6px;margin-bottom:12px}
.steps li{list-style:none;flex:1;min-width:0;text-align:center;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:6px 4px;font-family:var(--display);font-weight:700;font-size:clamp(12px,2.6vw,16px);line-height:1.15;color:var(--ink3)}
.steps li b{display:block;font-size:clamp(18px,4vw,24px)}
.steps li.cur{background:var(--blue);border-color:var(--blue);color:#fff}
.steps li.done{background:var(--greenwash);border-color:var(--green);color:var(--green)}
ol.steps{margin:0 0 12px;padding:0}
.nav{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:16px}
.big{border:none;background:var(--blue);color:#fff;border-radius:16px;padding:14px 26px;font-family:var(--display);font-weight:800;font-size:22px;min-height:58px}
.big.alt{background:var(--surface);color:var(--blue);border:2.5px solid var(--blue)}
.big:disabled{opacity:.4;cursor:not-allowed}
.ideas{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:12px}
.idea{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;min-height:170px;border-radius:20px;border:3px dashed var(--violet);background:var(--violetwash);padding:14px}
.idea .q{font-family:var(--display);font-weight:800;font-size:58px;line-height:1;color:var(--violet)}
.idea b{font-family:var(--display);font-size:24px}
.idea .em{font-size:54px;line-height:1}
.idea span.t{font-size:19px;font-weight:600}
.idea.open{border-style:solid;border-color:var(--green);background:var(--greenwash)}
.paper{background:var(--paper);border:2px solid var(--line);border-radius:18px;padding:clamp(14px,3vw,24px);font-size:clamp(26px,5.6vw,38px);line-height:1.75;font-family:var(--display);font-weight:600}
.sent{margin:0 0 6px;transition:opacity .4s,transform .4s}
.sent.hid{opacity:0;transform:translateY(8px)}
.line{display:inline}
.tok{display:inline-block;font:inherit;font-weight:inherit;background:none;border:2.5px solid transparent;border-radius:12px;padding:0 6px;margin:2px 1px;line-height:1.35;color:inherit}
button.tok:hover{background:var(--violetwash)}
.tok.pick{border-color:var(--violet);background:var(--violetwash)}
.tok.ok{border-color:var(--green);background:var(--greenwash);cursor:default}
.tok.reveal{border-color:var(--red);background:var(--redwash);cursor:default}
.tok.blank{border:2.5px dashed var(--violet);background:var(--violetwash);color:var(--violet);min-width:3.2em;text-align:center}
.tok.fixed{border-color:var(--green);background:var(--greenwash)}
.tok.shake{animation:shake .4s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.sentwrap{display:inline;border-radius:10px}
.sentwrap.hint{background:var(--sunwash);outline:3px solid var(--sun);outline-offset:2px}
.msg{min-height:1.5em;font-weight:600;font-size:18px;margin-top:12px}
.whys{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.why{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--paper);border:2px solid var(--line);border-radius:14px;padding:8px 12px;font-size:17px}
.why b{font-family:var(--display);font-size:24px;background:var(--redwash);border:2px solid var(--red);border-radius:10px;padding:0 10px}
.banner{background:var(--sunwash);border:2.5px solid var(--sun);border-radius:16px;padding:12px 18px;text-align:center;font-family:var(--display);font-weight:800;font-size:clamp(20px,4vw,26px);margin-top:14px}
.opts{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.opt{min-width:120px;min-height:68px;border:3px solid var(--line);background:var(--surface);border-radius:18px;padding:8px 22px;font-family:var(--display);font-weight:800;font-size:32px}
.opt:hover:not(:disabled){border-color:var(--violet)}
.opt:disabled{opacity:.4;cursor:default}
.opt.good{border-color:var(--green);background:var(--greenwash);opacity:1}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{flex:1;min-width:150px;border:3px solid var(--line);background:var(--surface);border-radius:16px;padding:10px;font-family:var(--display);font-weight:800;font-size:19px;line-height:1.15}
.tabs button small{display:block;font-family:var(--body);font-weight:600;font-size:13px;color:var(--ink2)}
.tabs button[aria-pressed="true"]{border-color:var(--violet);background:var(--violetwash)}
.w{display:inline-block;border-radius:10px;padding:0 5px;margin:0 1px;transition:background .15s}
.w.hl{background:var(--sun);color:#1B2F55}
.w.dot{color:var(--ink3);padding:0 2px}
.sayrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.say{display:inline-flex;align-items:center;gap:8px;border:2.5px solid var(--blue);background:var(--surface);color:var(--blue);border-radius:999px;padding:8px 20px;font-weight:800;font-size:18px;min-height:52px}
.say.slow{border-color:var(--violet);color:var(--violet)}
body[data-tts="0"] .sayrow{display:none}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:12px;margin-top:12px}
.qa button{display:flex;flex-direction:column;align-items:center;gap:4px;border:3px solid var(--line);background:var(--surface);border-radius:18px;padding:14px 8px;font-family:var(--display);font-weight:700;font-size:22px}
.qa button .em{font-size:44px;line-height:1}
.qa button.good{border-color:var(--green);background:var(--greenwash)}
.qa button:disabled:not(.good){opacity:.4}
.done{text-align:center}
.done .big-stars{font-size:clamp(40px,10vw,64px);letter-spacing:.1em;margin:8px 0}
.done h2{font-family:var(--display);font-size:clamp(28px,6vw,40px);margin:8px 0}
.rows{display:inline-flex;flex-direction:column;gap:6px;text-align:left;margin:10px 0 18px;font-size:19px}
.pop{animation:pop .5s ease}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}

/* chọn bài học */
.pathbtn{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border:2.5px solid var(--violet);border-radius:20px;padding:14px 18px}
.pathbtn:hover{background:var(--violetwash)}
.pathbtn .em{font-size:46px;line-height:1}
.pathbtn b{display:block;font-family:var(--display);font-size:clamp(22px,4.6vw,28px);line-height:1.15}
.pathbtn .s{color:var(--ink2);font-size:16px}
.pathbtn .go{margin-left:auto;font-family:var(--display);font-weight:800;font-size:34px;color:var(--violet)}
.weeks{display:flex;flex-direction:column;gap:14px}
.weeklab{font-family:var(--display);font-weight:700;font-size:15px;color:var(--ink3);margin:0 0 4px 2px}
.row5{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.lcell{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:72px;padding:6px 2px;border:2.5px solid var(--line);background:var(--paper);border-radius:16px;text-align:center}
.lcell:hover{border-color:var(--violet)}
.lcell .n{font-family:var(--display);font-weight:800;font-size:clamp(22px,5vw,30px);line-height:1}
.lcell .t{font-size:clamp(10px,2.5vw,13px);line-height:1.15;color:var(--ink2);font-weight:600;max-width:100%;overflow:hidden;overflow-wrap:anywhere}
.lcell .tag{position:absolute;top:-8px;right:-4px;font-size:18px;line-height:1}
.lcell .got{font-size:11px;font-weight:700;color:var(--sun);filter:saturate(1.2)}
.lcell.past{background:var(--greenwash);border-color:var(--green)}
.lcell.rev{border-style:dashed}
.lcell.cur{background:var(--violetwash);border:3.5px solid var(--violet)}
.lcell.cur .n{color:var(--violet)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{font-family:var(--display);font-weight:800;font-size:clamp(26px,6vw,36px);line-height:1.2;background:var(--violetwash);border:2.5px solid var(--violet);border-radius:14px;padding:2px 16px;color:var(--violet)}
.wgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.wcard{font-family:var(--display);font-weight:700;font-size:clamp(26px,5.6vw,34px);line-height:1.2;background:var(--paper);border:2.5px solid var(--line);border-radius:16px;padding:10px 6px;min-height:68px;transition:background .15s}
.wcard:hover{border-color:var(--violet)}
.wcard.hl{background:var(--sun);border-color:var(--sun);color:#1B2F55}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.acts{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr))}
.act{display:flex;flex-direction:column;gap:3px;align-items:flex-start;text-align:left;background:var(--surface);border:2.5px solid var(--line);border-radius:18px;padding:14px 16px;min-height:104px}
.act:hover:not(:disabled){border-color:var(--violet)}
.act:disabled{opacity:.5;cursor:not-allowed}
.act .em{font-size:38px;line-height:1}
.act b{font-family:var(--display);font-size:22px;line-height:1.15}
.act small{color:var(--ink2);font-size:14px}
.act .actstars{margin-top:auto;font-weight:700;color:var(--sun);filter:saturate(1.2);letter-spacing:.08em;font-size:16px}
.act .actstars i{font-style:normal;color:var(--ink3);font-size:13px;letter-spacing:0;margin-left:6px}
.nav.between{justify-content:space-between}
/* thám tử chữ nhanh */
.qdots{display:flex;gap:6px;margin:0;padding:0;list-style:none}
.qdots li{flex:1;text-align:center;background:var(--paper);border:2px solid var(--line);border-radius:12px;padding:4px 0;font-family:var(--display);font-weight:800;font-size:18px;color:var(--ink3)}
.qdots li.cur{background:var(--blue);border-color:var(--blue);color:#fff}
.qdots li.ok{background:var(--greenwash);border-color:var(--green);color:var(--green)}
.qtiles{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin:8px 0 4px}
.qt{font-family:var(--display);font-weight:800;font-size:clamp(30px,8vw,48px);line-height:1.2;min-width:110px;min-height:84px;border:3px solid var(--line);background:var(--paper);border-radius:20px;padding:6px 18px;color:var(--ink)}
.qt:hover:not(:disabled){border-color:var(--violet);background:var(--violetwash)}
.qt:disabled{cursor:default}
.qt.no{border-color:var(--red);background:var(--redwash);opacity:.7}
.qt.ok{border-color:var(--green);background:var(--greenwash);opacity:1}
.qt.reveal{border-color:var(--red);background:var(--redwash);opacity:1}
.qt.shake{animation:shake .4s}
.qt.word{font-size:clamp(24px,6vw,36px);min-width:150px}
.qt.hl{background:var(--sun);border-color:var(--sun);color:#1B2F55}
/* đọc âm, vần · tiếng · từ */
.h3{font-family:var(--display);font-size:22px;margin:0 0 4px;display:flex;align-items:center;gap:10px}
.h3 .num{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;background:var(--violet);color:#fff;font-size:19px;flex:none}
.h3sub{font-size:14px;color:var(--ink2);margin:0 0 12px}
.units{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:12px}
.ucard{background:var(--paper);border:2.5px solid var(--line);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.uhead{display:flex;align-items:center;gap:12px}
.ubig{font-family:var(--display);font-weight:800;font-size:clamp(40px,9vw,56px);line-height:1.1;color:var(--violet);background:var(--surface);border:3px solid var(--violet);border-radius:16px;padding:4px 18px;min-width:88px;text-align:center}
.ubig.hl{background:var(--sun);border-color:var(--sun);color:#1B2F55}
.ukind{display:flex;flex-direction:column;font-weight:700;color:var(--ink2);font-size:15px;line-height:1.3}
.ukind b{font-family:var(--display);font-size:20px;color:var(--ink)}
.spell{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.splab{width:100%;font-size:13px;font-weight:700;color:var(--ink3)}
.sp{font-family:var(--display);font-weight:700;font-size:clamp(22px,5vw,28px);line-height:1.2;border:2px solid var(--line);background:var(--surface);border-radius:12px;padding:2px 12px;min-height:44px;transition:background .15s}
.sp small{font-family:var(--body);font-size:13px;font-weight:600;color:var(--ink2);margin-left:4px}
.sp.res{border-color:var(--violet);color:var(--violet)}
.sp.tone{font-size:18px;color:var(--ink2)}
.sp.hl{background:var(--sun);border-color:var(--sun);color:#1B2F55}
.sp.hl small{color:#1B2F55}
.arr{color:var(--ink3);font-weight:800;font-size:20px}
.ucard .sayrow{margin-top:0}
.mk{color:var(--violet);text-decoration:underline;text-decoration-thickness:3px;text-underline-offset:5px}
.wcard.hl .mk{color:#1B2F55}
.wgrid.words{grid-template-columns:repeat(auto-fill,minmax(150px,1fr))}
.wcard .wem{display:block;font-size:34px;line-height:1.1;margin-bottom:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top"><span id="logo"></span><h1>Học Tiếng Việt lớp 1 cùng bạn máy</h1><span class="stars" title="Tổng số sao">⭐ <span id="starTotal">0</span></span><button class="homebtn" id="homeBtn" hidden aria-label="Về trang chủ" title="Về trang chủ">🏠</button></header>
  <main id="main"></main>
</div>
<script>
(function(){
'use strict';

// ===== Phân tích tiếng Việt và dữ liệu bài học (Tiếng Việt lớp 1 – NXB Giáo dục Việt Nam) =====

const TONES = ['huyền','sắc','hỏi','ngã','nặng'];
const UNIT_LESSON = {};
LESSONS.forEach(l => l.u.forEach(u => { if (!(u in UNIT_LESSON)) UNIT_LESSON[u] = l.n; }));
const isTone = u => TONES.includes(u);
const lessonOf = n => LESSONS.find(l => l.n === n);

function splitTone(word) {
  let tone = null;
  const base = word.normalize('NFD').replace(/[̣̀́̃̉]/g, m => { tone = TONE_MARKS[m]; return ''; }).normalize('NFC');
  return { base, tone };
}

// Tách một tiếng thành âm đầu + vần + thanh
function parseSyllable(raw) {
  const w = raw.toLowerCase().replace(/[^a-zà-ỹđ]/g, '');
  if (!w) return null;
  const { base, tone } = splitTone(w);
  let onset = '';
  for (const o of ONSETS) {
    if (base.startsWith(o) && base.length > o.length) { onset = o; break; }
    if (o === 'gi' && base === 'gi') { onset = 'gi'; break; }
  }
  let rime = base.slice(onset.length);
  if (onset === 'gi' && rime === '') rime = 'i';
  return { word: w, onset, rime, tone };
}

// Kiểm tra một tiếng chỉ dùng chữ đã học đến bài N
function checkSyllable(raw, N) {
  const p = parseSyllable(raw);
  if (!p) return { ok: true, skip: true };
  const bad = [];
  if (p.onset && !((UNIT_LESSON[p.onset] || 999) <= N)) bad.push(p.onset);
  if (!((UNIT_LESSON[p.rime] || 999) <= N)) bad.push(p.rime || '?');
  if (p.tone && !((UNIT_LESSON[p.tone] || 999) <= N)) bad.push('dấu ' + p.tone);
  return { ...p, ok: bad.length === 0, bad };
}
const syllables = text => text.split(/[\s,.!?;:·…"“”()\-–]+/).filter(Boolean);
function checkText(text, N) {
  return syllables(text).map(s => ({ s, ...checkSyllable(s, N) }));
}
// Các đơn vị (âm, vần) mà một văn bản luyện, giới hạn trong danh sách cho trước
function unitsIn(text) {
  const set = new Set();
  syllables(text).forEach(s => { const p = parseSyllable(s); if (p) { if (p.onset) set.add(p.onset); if (p.rime) set.add(p.rime); } });
  return [...set];
}

// Cách đọc từng âm khi đánh vần; tên âm khi giới thiệu có thể khác (gh: gờ kép, ngh: ngờ kép, y: i dài, k: ca)

function unitSteps(u) {
  if (isTone(u)) return [{ show: 'dấu ' + u, say: 'dấu ' + u, tone: true }];
  if (isOnsetUnit(u) || [...u].length === 1) return [{ show: u, say: UNIT_NAME[u] || SOUND[u] || u, res: true }];
  // Vần có âm đệm o, u: đánh vần o – an – oan, u – ân – uân, u – i – uy
  if (/^o[aăe]/.test(u) || /^u[âêyơ]/.test(u)) {
    const rest = u.slice(1);
    return [{ show: u[0], say: u[0] }, { show: rest, say: rimeSay(rest) }, { show: u, say: rimeSay(u), res: true, arrow: true }];
  }
  // Nguyên âm đôi đọc là một âm: iê, yê đọc là "ia"; uô đọc là "ua"; ươ đọc là "ưa" (ươm: ưa – mờ – ươm; iêu: ia – u – iêu)
  const core2 = u.slice(0, 2);
  let fin = FINALS.find(f => u.endsWith(f) && u.length > f.length) || '';
  if (!fin && DIPH[core2] && [...u].length > 2) fin = u.slice(2);
  const core = u.slice(0, u.length - fin.length);
  const st = DIPH[core] ? [{ show: core, say: DIPH[core] }] : [...core].map(ch => ({ show: ch, say: SOUND[ch] || ch }));
  if (fin) st.push({ show: fin, say: SOUND[fin] || fin });
  st.push({ show: u, say: rimeSay(u), res: true, arrow: true });
  return st;
}
// Các bước đánh vần một tiếng: bờ – an – ban – huyền – bàn
function tiengSteps(p) {
  const st = [], gii = p.onset === 'gi' && p.rime === 'i';
  const base = gii ? 'gi' : p.onset + p.rime;
  if (p.onset && !gii) st.push({ show: p.onset, say: SOUND[p.onset] || p.onset });
  if (!gii) st.push({ show: p.rime, say: rimeSay(p.rime) });
  if (p.onset) st.push({ show: base, say: base, arrow: true, res: !p.tone });
  if (p.tone) { st.push({ show: p.tone, say: p.tone, tone: true, arrow: true }); st.push({ show: p.word, say: p.word, res: true, arrow: true }); }
  return st.length > 1 ? st : null;
}

    if (!p || (p.onset === 'gi' && p.rime === 'i')) return false;
    if (isTone(u)) return p.tone === u;
    if (isOnsetUnit(u)) return p.onset === u;

  const tiengRound = () => {
    const f = shuffle(focus.filter(x => !used.has(x.w))), rest = shuffle(known.filter(x => !used.has(x.w) && !f.includes(x)));
    let pick = f.concat(rest).slice(0, Math.min(3, known.length));
    if (pick.length < 3) pick = shuffle(known).slice(0, 3);
    pick.forEach(x => used.add(x.w));
    const o = pickOdd(odd, pick.map(x => x.w), used); used.add(o.w);
    return { kind: 'tiếng', odd: o.w, tiles: shuffle([...pick.map(x => ({ w: x.w, bad: false })), { w: o.w, bad: true }]) };
  };
  const wpool = typeof wordsPool === 'function' ? wordsPool(n) : [], wodd = WORDS.filter(x => x.max > n);
  const tuRound = () => {
    const fresh = wpool.filter(x => !used.has(x.w));
    const pick = shuffle(fresh.filter(x => x.max === n)).concat(shuffle(fresh.filter(x => x.max !== n))).slice(0, 3);
    pick.forEach(x => used.add(x.w));
    const o = pickOdd(wodd, pick.map(x => x.w), used); used.add(o.w);
    return { kind: 'từ', odd: o.w, tiles: shuffle([...pick.map(x => ({ w: x.w, bad: false })), { w: o.w, bad: true }]) };
  };
  for (let r = 0; r < 5; r++) {
    const wantTu = r >= 3 && wodd.length && wpool.filter(x => !used.has(x.w)).length >= 3;
    rounds.push(wantTu ? tuRound() : tiengRound());
  }
  return rounds;
}
// Vì sao tiếng (hoặc từ) là lạ
function oddWhy(rd, n) {
  if (rd.kind !== 'từ') return 'có ' + whyBad(checkSyllable(rd.odd, n), n);
  const bad = rd.odd.split(' ').find(sy => !checkSyllable(sy, n).ok);
  return 'có tiếng “' + bad + '”, tiếng này có ' + whyBad(checkSyllable(bad, n), n);
}
function startQuick(n) { const rounds = makeRounds(n); if (!rounds) return; Q = { n, rounds, i: 0, stars: 0, tries: 0, solved: false }; go('quick'); }
function quickView(m) {
  const n = Q.n, rd = Q.rounds[Q.i], last = Q.i >= Q.rounds.length - 1;
  const dots = el('ol', { class: 'qdots', 'aria-label': 'Vòng ' + (Q.i + 1) + ' trên ' + Q.rounds.length });
  Q.rounds.forEach((_, i) => dots.append(el('li', { class: i < Q.i ? 'ok' : i === Q.i ? 'cur' : '', text: i < Q.i ? '✓' : String(i + 1) })));
  const msg = el('div', { class: 'msg', 'aria-live': 'polite' }), whys = el('div', { class: 'whys' });
  const nb = nextBtn(last ? 'Xem sao của em ›' : 'Vòng tiếp theo ›', () => { if (last) finishQuick(); else { Q.i++; Q.tries = 0; Q.solved = false; stopSpeak(); render(); } }, false);
  const K = rd.kind, KC = cap(K);
  const tiles = el('div', { class: 'qtiles', role: 'group', 'aria-label': 'Chọn ' + K + ' lạ' });
  const btns = rd.tiles.map(t => { const b = el('button', { class: 'qt' + (K === 'từ' ? ' word' : ''), text: t.w }); tiles.append(b); return b; });
  const listen = listenBtn('Nghe các ' + K, () => speak('', { segs: rd.tiles.map(t => ({ text: t.w, gap: 700 })), rate: wordRate(), onSeg: i => btns.forEach((b, k) => b.classList.toggle('hl', k === i)) }));
  const settle = reveal => {
    Q.solved = true; if (!reveal && Q.tries === 0) Q.stars++;
    msg.textContent = '';
    btns.forEach((b, k) => { b.disabled = true; if (rd.tiles[k].bad) { b.classList.remove('no'); b.classList.add(reveal ? 'reveal' : 'ok'); } });
    whys.append(el('div', { class: 'why' }, el('b', { text: rd.odd }), oddWhy(rd, n)));
    nb.disabled = false; nb.classList.add('pop'); chime(!reveal);
    setBub(reveal ? 'Bạn máy chỉ cho em ' + K + ' lạ nhé. ' + KC + ' “' + rd.odd + '” có chữ em chưa học.' : 'Đúng rồi! ' + KC + ' “' + rd.odd + '” là ' + K + ' lạ.');
  };
  btns.forEach((b, k) => {
    b.onclick = () => {
      if (Q.solved) return;
      const t = rd.tiles[k];
      if (t.bad) return settle(false);
      Q.tries++; b.disabled = true; b.classList.add('no', 'shake'); setTimeout(() => b.classList.remove('shake'), 500); chime(false);
      if (Q.tries >= 2) return settle(true);
      const txt = KC + ' “' + t.w + '” em đã học rồi. Em tìm ' + K + ' lạ khác nhé.'; msg.textContent = txt; cue([txt]);
    };
  });
  m.append(el('div', { class: 'stack' }, dots, talkRow(), el('div', { class: 'card' }, tiles, el('div', { class: 'sayrow', style: 'justify-content:center' }, listen), msg, whys, el('div', { class: 'nav' }, nb))));
  const UL = lessonUnits(n).map(unitLabel).join(', ');
  setBub('Vòng ' + (Q.i + 1) + '. ' + (UL ? 'Bài ' + n + ': ' + UL + '. ' : '') + KC + ' nào có chữ em chưa học? Chạm vào ' + K + ' lạ nhé!');
}
function finishQuick() {
  const n = Q.n, mx = Q.rounds.length, tot = Q.stars;
  ST.qbest[n] = Math.max(ST.qbest[n] || 0, tot); save();
  LAST = { mx, tot, rows: ['🔍 Tìm tiếng lạ, từ lạ: ' + tot + '/' + mx + ' sao'], note: 'Em nhớ nhé: tiếng lạ là tiếng có chữ em chưa học!',
    primary: ['Về bài học', () => { CUR = n; go('lesson'); }], again: () => startQuick(n) };
  go('done');
}

// ---------- Kết thúc truyện và màn kết quả chung ----------
function finishRun() {
  const sid = R.sid, from = R.from, mx = MAXSTAR(sid), tot = Math.min(R.readStar + R.qStar, mx);
  ST.best[sid] = Math.max(Math.min(ST.best[sid] || 0, mx), tot); save();
  LAST = { mx, tot, rows: ['📖 Đọc truyện: ' + R.readStar + ' sao', '❓ Trả lời câu hỏi: ' + R.qStar + ' sao'],
    note: 'Em nhớ nhé: đọc chậm, rõ từng tiếng, nghỉ hơi ở dấu chấm!',
    medals: [['🏅', 'Bạn đọc giỏi'], ['🥈', 'Bạn đọc chăm'], ['📖', 'Bạn đọc tập sự']],
    primary: from === 'lesson' ? ['Về bài học', () => go('lesson')] : ['Về trang chủ', () => go('home')],
    again: () => { startPlay(sid); R.from = from; } };
  go('done');
}
function doneView(m) {
  const D = LAST, mx = D.mx, tot = Math.min(D.tot, mx);
  const MD = D.medals || [['🏅', 'Thám tử vàng'], ['🥈', 'Thám tử bạc'], ['🔍', 'Thám tử tập sự']];
  const medal = tot >= mx ? MD[0] : tot >= mx * 0.6 ? MD[1] : MD[2];
  const msg = (ST.name ? ST.name + ' ơi, ' : '') + 'em được ' + tot + ' sao. Em là ' + medal[1].toLowerCase() + '!';
  const may = el('div'); may.innerHTML = maySVG(120);
  m.append(el('div', { class: 'card done pop' },
    may, el('div', { class: 'big-stars', 'aria-label': tot + ' sao', text: '⭐'.repeat(tot) + '☆'.repeat(mx - tot) }),
    el('h2', { text: medal[0] + ' ' + medal[1] }),
    el('div', { class: 'rows' }, D.rows.map(t => el('span', { text: t }))),
    el('div', { class: 'note', text: D.note }),
    el('div', { class: 'nav', style: 'justify-content:center' }, nextBtn(D.primary[0], D.primary[1]), el('button', { class: 'big alt', text: 'Chơi lại', onclick: D.again }))));
  setTimeout(() => { if (view === 'done') cue([msg, D.note]); }, 300);
}


render();
})();
</script>
